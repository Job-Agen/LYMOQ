name: Release Android (Play Store AAB)

# Builds the Play Store variant (APP_VARIANT=production, see apps/mobile/app.config.js)
# as a signed Android App Bundle. Run it by hand from the Actions tab.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_UPLOAD_KEYSTORE_BASE64   upload keystore (.jks), base64-encoded
#   ANDROID_UPLOAD_STORE_PASSWORD    keystore password
#   ANDROID_UPLOAD_KEY_ALIAS         key alias inside the keystore
#   ANDROID_UPLOAD_KEY_PASSWORD      key password
# Optional repository variable:
#   PROD_API_URL                     https API baked into the app (default: the Vercel production API)

on:
  workflow_dispatch:

jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      APP_VARIANT: production
      EXPO_PUBLIC_APP_VARIANT: production
      EXPO_PUBLIC_API_URL: ${{ vars.PROD_API_URL || 'https://mesura-38r8.vercel.app' }}
    steps:
      - name: Check signing secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE" ] || missing="$missing ANDROID_UPLOAD_KEYSTORE_BASE64"
          [ -n "$STORE_PASSWORD" ] || missing="$missing ANDROID_UPLOAD_STORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing ANDROID_UPLOAD_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing ANDROID_UPLOAD_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi
          case "$EXPO_PUBLIC_API_URL" in
            https://*) ;;
            *) echo "::error::PROD_API_URL must start with https://"; exit 1 ;;
          esac

      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: pnpm install --frozen-lockfile
      - run: pnpm build:shared

      - name: Generate native Android project (production variant)
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Restore upload keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Build signed App Bundle
        working-directory: apps/mobile/android
        env:
          MESURA_UPLOAD_STORE_FILE: ${{ runner.temp }}/upload.jks
          MESURA_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          MESURA_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          MESURA_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Verify the bundle is signed with the upload key
        run: |
          AAB=apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify -verbose:summary "$AAB" | tail -n 5
          if keytool -printcert -jarfile "$AAB" | grep -q "CN=Android Debug"; then
            echo "::error::The bundle is signed with the debug key"
            exit 1
          fi

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: mesura-play-store-aab
          path: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
