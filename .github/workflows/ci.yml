name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Official image via the AWS mirror: Docker Hub rate-limits shared runners.
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: mesura
          POSTGRES_PASSWORD: mesura
          POSTGRES_DB: mesura
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mesura" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://mesura:mesura@localhost:5432/mesura?schema=public
      DIRECT_URL: postgresql://mesura:mesura@localhost:5432/mesura?schema=public
      JWT_SECRET: ci-only-secret-that-is-at-least-32-characters-long
      SANDBOX_MODE: 'true'
      SANDBOX_FUNDING_AUTO_CONFIRM_SECONDS: '10'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Migrate and seed
        run: |
          pnpm --filter @mesura/api prisma:deploy
          pnpm db:seed
      - name: API smoke test
        run: |
          pnpm --filter @mesura/api build
          node apps/api/dist/main.js > api.log 2>&1 &
          # Wait until the API answers (an unauthenticated request returns a JSON 401).
          timeout 60 bash -c 'until curl -s localhost:3000/me | grep -q statusCode; do sleep 1; done'
          pnpm --filter @mesura/api smoke
      - if: failure()
        run: cat api.log || true
